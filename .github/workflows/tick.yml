name: Mira Voss Agent Tick

on:
  schedule:
    # Every 25 minutes — fallback when Vercel Cron is unavailable (free tier)
    - cron: "*/25 * * * *"
  # Manual trigger from GitHub Actions UI (e.g. for debugging or initial test)
  workflow_dispatch:
    inputs:
      agentId:
        description: "Specific agent UUID to tick (leave empty to run all agents)"
        required: false
        type: string

jobs:
  tick:
    name: Run Mira Voss tick
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Trigger autonomous tick endpoint
        env:
          APP_URL: ${{ secrets.MIRA_APP_URL }}
          CRON_SECRET: ${{ secrets.MIRA_CRON_SECRET }}
          AGENT_ID: ${{ github.event.inputs.agentId }}
        run: |
          # Build request body
          if [ -n "$AGENT_ID" ]; then
            BODY="{\"agentId\":\"$AGENT_ID\"}"
          else
            BODY="{}"
          fi

          echo "Triggering tick at $APP_URL/api/agent/tick"

          HTTP_STATUS=$(curl \
            --silent \
            --output /tmp/tick_response.json \
            --write-out "%{http_code}" \
            --max-time 180 \
            --retry 2 \
            --retry-delay 10 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -d "$BODY" \
            "$APP_URL/api/agent/tick")

          echo "HTTP status: $HTTP_STATUS"
          echo "Response body:"
          cat /tmp/tick_response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: Tick endpoint returned non-2xx status $HTTP_STATUS"
            exit 1
          fi

          echo "Tick completed successfully"
